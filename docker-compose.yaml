services:
  web:
    container_name: web
    build:
      context: ./server
      dockerfile: ./Dockerfile
    env_file:
      - ./.env
    # ports:
    #   - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./www/html:/var/www/html:ro
    depends_on:
      web:
        condition: service_started
      certs:
        condition: service_completed_successfully

  # Issues nginx's TLS certificate from a private home CA, then exits. Runs
  # on every `up` (nginx waits for it) but only issues a new certificate when
  # needed; see certs/issue-certs.sh. The CA's key stays in the ca-data volume.
  certs:
    container_name: certs
    build:
      context: ./certs
    env_file:
      - ./.env
    environment:
      OUT_UID: ${CERTS_UID:-1000}
      OUT_GID: ${CERTS_GID:-1000}
    volumes:
      - ca-data:/ca
      - ./nginx/certs:/out
    restart: "no"

  db:
    container_name: db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      PGTZ: Europe/Sofia
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    volumes:
      - db-data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opt-in: start with `make autodeploy`. Pulls main once CI passes and
  # rebuilds the stack. The repo is mounted at its host path so that
  # relative bind mounts in this file resolve the same inside and outside.
  deployer:
    container_name: deployer
    profiles: [autodeploy]
    build:
      context: ./deploy
    restart: unless-stopped
    user: "${AUTODEPLOY_UID:-1000}:${AUTODEPLOY_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    working_dir: ${AUTODEPLOY_DIR:-/autodeploy-dir-unset}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AUTODEPLOY_DIR:-/autodeploy-dir-unset}:${AUTODEPLOY_DIR:-/autodeploy-dir-unset}
    environment:
      AUTODEPLOY_INTERVAL: ${AUTODEPLOY_INTERVAL:-1800}

volumes:
  db-data:
  # The home CA: back it up (make ca-backup). Losing it means every device
  # has to trust a new CA.
  ca-data:
