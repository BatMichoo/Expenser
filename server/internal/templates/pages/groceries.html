{{ define "groceries-page" }}
<div class="tracker-page">
  <div class="page-header">
    <h1>{{ T .Lang "groceries.title" }}</h1>
    <button
      class="btn-primary"
      hx-get="/groceries/create"
      hx-target="#action-dialog"
      hx-swap="innerHTML"
    >
      {{ T .Lang "groceries.add" }}
    </button>
    <button
      type="button"
      class="tracker-nav-button section-button"
      hx-get="/groceries/chart"
      hx-target="#groceries-chart-section"
      hx-swap="innerHTML"
    >
      {{ T .Lang "common.chart" }}
    </button>
  </div>

  <div id="groceries-content">{{ template "groceries-receipt-form" . }}</div>

  <div id="groceries-chart-section"></div>

  <div id="recent-groceries">{{ template "groceries-current" . }}</div>
</div>
{{ end }}
