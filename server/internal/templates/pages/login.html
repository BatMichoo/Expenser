{{ define "login-page"}}
<div class="login-form-container">
  <h2>{{ T .Lang "login.title" }}</h2>
  <form hx-post="/login" hx-swap="none">
    <div class="form-group">
      <label for="login-username">{{ T .Lang "login.username" }}</label>
      <input
        type="text"
        id="login-username"
        name="username"
        class="form-control"
        placeholder='{{ T .Lang "login.username_placeholder" }}'
        required
      />
    </div>

    <div class="form-group">
      <label for="login-password">{{ T .Lang "login.password" }}</label>
      <input
        type="password"
        id="login-password"
        name="password"
        class="form-control"
        placeholder='{{ T .Lang "login.password_placeholder" }}'
        required
      />
    </div>

    <button type="submit" class="btn-primary">{{ T .Lang "login.submit" }}</button>
  </form>
  <p class="auth-switch">
    {{ T .Lang "login.no_account" }}
    <a hx-get="/register" hx-target="#tracker-content" hx-push-url="true">{{ T .Lang "login.register_link" }}</a>
  </p>
</div>
{{end}}
