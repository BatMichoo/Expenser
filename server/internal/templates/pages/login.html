{{ define "login-page"}}
<section class="auth-split">
  {{ template "auth-brand" . }}
  <div class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">{{ T .Lang "login.title" }}</h1>
      <p class="auth-sub">{{ T .Lang "login.subtitle" }}</p>
      <form class="auth-form" hx-post="/login" hx-swap="none">
        {{ if .Next }}<input type="hidden" name="next" value="{{ .Next }}" />{{ end }}
        <div class="auth-field">
          <label for="login-username">{{ T .Lang "login.username" }}</label>
          <input type="text" id="login-username" name="username" autocomplete="username" autocapitalize="none"
            placeholder='{{ T .Lang "login.username_placeholder" }}' required autofocus />
        </div>
        <div class="auth-field">
          <label for="login-password">{{ T .Lang "login.password" }}</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password"
            placeholder='{{ T .Lang "login.password_placeholder" }}' required />
        </div>
        <button type="submit" class="auth-submit">{{ T .Lang "login.submit" }}</button>
      </form>
      <p class="auth-switch">
        {{ T .Lang "login.no_account" }}
        <a href="/register" hx-get="/register" hx-target="#tracker-content" hx-push-url="true">{{ T .Lang "login.register_link" }}</a>
      </p>
    </div>
  </div>
</section>
{{end}}
