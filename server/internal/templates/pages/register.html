{{ define "register-page"}}
<section class="auth-split">
  {{ template "auth-brand" . }}
  <div class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">{{ T .Lang "register.title" }}</h1>
      <p class="auth-sub">{{ T .Lang "register.subtitle" }}</p>
      <form class="auth-form" hx-post="/register" hx-target="#tracker-content">
        <div class="auth-field">
          <label for="username">{{ T .Lang "login.username" }}</label>
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none"
            placeholder='{{ T .Lang "login.username_placeholder" }}' minlength="3" maxlength="50" required autofocus />
        </div>
        <div class="auth-field">
          <label for="password">{{ T .Lang "login.password" }}</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
            placeholder='{{ T .Lang "login.password_placeholder" }}' minlength="6" required
            oninput="checkRegisterPasswords()" />
          <span class="field-hint">{{ T .Lang "settings.new_password_hint" }}</span>
        </div>
        <div class="auth-field">
          <label for="confirm_password">{{ T .Lang "register.confirm_password" }}</label>
          <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password"
            placeholder='{{ T .Lang "register.confirm_password" }}' minlength="6" required
            oninput="checkRegisterPasswords()" data-mismatch='{{ T .Lang "auth.passwords_mismatch" }}' />
          <span class="field-hint field-error" id="password-match-feedback" aria-live="polite"></span>
        </div>
        <button type="submit" class="auth-submit">{{ T .Lang "register.submit" }}</button>
      </form>
      <p class="auth-switch">
        {{ T .Lang "register.have_account" }}
        <a href="/login" hx-get="/login" hx-target="#tracker-content" hx-push-url="true">{{ T .Lang "register.login_link" }}</a>
      </p>
    </div>
  </div>
  <script>
    // Inline handlers, not a DOMContentLoaded listener: this page is often
    // swapped in by HTMX, after that event has fired.
    function checkRegisterPasswords() {
      const pw = document.getElementById("password");
      const confirm = document.getElementById("confirm_password");
      const feedback = document.getElementById("password-match-feedback");
      const msg = confirm.value !== "" && pw.value !== confirm.value ? confirm.dataset.mismatch : "";
      feedback.textContent = msg;
      confirm.setCustomValidity(msg);
    }
  </script>
</section>
{{end}}
