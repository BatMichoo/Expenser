{{ define "groceries-receipt-result" }}
<div class="receipt-result">
    <h3>Extracted Receipt Data: {{ .Store }}</h3>
    <form hx-post="/groceries/confirm" hx-target="#result" hx-swap="innerHTML">
        {{ range $index, $item := .Items }}
        <div class="receipt-item">
            <input type="hidden" name="product" value="{{ $item.Name }}">
            <input type="hidden" name="quantity" value="{{ $item.Quantity }}">
            <input type="hidden" name="price" value="{{ $item.TotalPrice }}">
            <input type="hidden" name="supermarket_name" value="{{ $.Store }}">
            
            <ul>
                <li><strong>Product:</strong> {{ $item.Name }}</li>
                <li><strong>Quantity:</strong> {{ $item.Quantity }}</li>
                <li><strong>Price:</strong> {{ $item.TotalPrice }}</li>
            </ul>
        </div>
        {{ end }}
        <button type="submit" class="btn-primary">Confirm & Save</button>
    </form>
    <button hx-get="/groceries/form" hx-target="#result" hx-swap="innerHTML">Clear</button>
</div>
{{ end }}
