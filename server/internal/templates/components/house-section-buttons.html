{{ define "house-section-buttons" }}
<ul id="section-list">
  <li class="section-title">
    <h2>{{ template "icon" (dict "Name" "house") }}{{ T .Lang "nav.house" }}</h2>
  </li>
  <li>
    <button
      type="button"
      hx-get="/house/current"
      hx-push-url="/house"
      hx-vals='js:{month: new URLSearchParams(window.location.search).get("month") || ""}'
      hx-target="#section-content"
      class="tracker-nav-button section-button active"
    >
      {{ T .Lang "common.list" }}
    </button>
  </li>
  <li>
    <button
      type="button"
      hx-get="/house/chart"
      hx-target="#section-content"
      hx-push-url="true"
      class="tracker-nav-button section-button"
    >
      {{ T .Lang "common.chart" }}
    </button>
  </li>
</ul>
 {{ end }}
