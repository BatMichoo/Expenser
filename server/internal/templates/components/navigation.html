{{ define "navigation" }}
<nav id="tracker-navigation" {{ if .IsOOB}} hx-swap-oob="true" {{ end }}>
  {{ if .IsLoggedIn }}
  <button class="tracker-nav-button" hx-get="/house" hx-target="#tracker-content" hx-push-url="true" data-path="/house">
    {{ template "icon" (dict "Name" "house") }}
    {{ T .Lang "nav.house" }}
  </button>
  <button class="tracker-nav-button" hx-get="/car" hx-target="#tracker-content" hx-push-url="true" data-path="/car">
    {{ template "icon" (dict "Name" "car") }}
    {{ T .Lang "nav.car" }}
  </button>
  <button class="tracker-nav-button" hx-get="/groceries" hx-target="#tracker-content" hx-push-url="true" data-path="/groceries">
    {{ template "icon" (dict "Name" "groceries") }}
    {{ T .Lang "nav.groceries" }}
  </button>
  <button class="tracker-nav-button" hx-get="/bills" hx-target="#tracker-content" hx-push-url="true" data-path="/bills">
    {{ template "icon" (dict "Name" "bills") }}
    {{ T .Lang "nav.bills" }}
  </button>
  {{ else }}
  <button class="tracker-nav-button" hx-get="/login" hx-target="#tracker-content" hx-push-url="true" data-path="/login">
    {{ template "icon" (dict "Name" "login") }}
    {{ T .Lang "nav.login" }}
  </button>
  <button class="tracker-nav-button" hx-get="/register" hx-target="#tracker-content" hx-push-url="true"
    data-path="/register">
    {{ template "icon" (dict "Name" "register") }}
    {{ T .Lang "nav.register" }}
  </button>
  {{ end }}
</nav>
{{ end }}
