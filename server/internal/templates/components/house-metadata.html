{{ define "house-metadata-electricity" }}
<div class="metadata-group">
  <div>
    <label for="kWhDay">{{ T .Lang "metadata.kWh_day" }}</label>
    <input type="number" id="kWhDay" name="kWhDay" step="0.01" min="0" placeholder='{{ T .Lang "form.amount_placeholder" }}' value="{{ if .Metadata }}{{ .Metadata.KWhDay }}{{ end }}" />
  </div>
  <div>
    <label for="priceDay">{{ T .Lang "metadata.price_day" }}</label>
    <input type="number" id="priceDay" name="priceDay" step="0.0001" min="0" placeholder="e.g., 0.2541" value="{{ if .Metadata }}{{ .Metadata.PriceDay }}{{ end }}" />
  </div>
  <div>
    <label for="kWhNight">{{ T .Lang "metadata.kWh_night" }}</label>
    <input type="number" id="kWhNight" name="kWhNight" step="0.01" min="0" placeholder='{{ T .Lang "form.amount_placeholder" }}' value="{{ if .Metadata }}{{ .Metadata.KWhNight }}{{ end }}" />
  </div>
  <div>
    <label for="priceNight">{{ T .Lang "metadata.price_night" }}</label>
    <input type="number" id="priceNight" name="priceNight" step="0.0001" min="0" placeholder="e.g., 0.1241" value="{{ if .Metadata }}{{ .Metadata.PriceNight }}{{ end }}" />
  </div>
</div>
{{ end }}

    <label for="pricePerUnit">{{ T .Lang "metadata.price_per_unit" }}</label>

  </div>
</div>
{{ end }}
