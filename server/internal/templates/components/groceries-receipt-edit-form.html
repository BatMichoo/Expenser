{{ define "groceries-receipt-edit-form" }}
<div class="receipt-edit-modal">
  <h3>{{ .Store }}</h3>
  <form
    hx-post="/groceries/confirm-batch"
    hx-target="#recent-expenses"
    hx-swap="afterbegin"
  >
    <table class="expenses-table">
      <thead>
        <tr>
          <th>Category</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Unit Price</th>
          <th>Discount/Unit</th>
          <th>Total Price</th>
          <th>Total Discount</th>
          <th>Supermarket</th>
        </tr>
      </thead>
      <tbody>
        {{ range $index, $item := .Items }}
        <tr>
          <td>
            <select name="items[{{ $index }}].category_id" required>
              {{ range $.Categories }}
              <option value="{{ .ID }}" {{ if eq .Name $item.Category }}selected{{ else if and (eq $item.Category "") (eq .Name "Other") }}selected{{ end }}>{{ T $.Lang (print "category." .Name) }}</option>
              {{ end }}
            </select>
          </td>
          <td>
            <input
              type="text"
              name="items[{{ $index }}].product"
              value="{{ $item.Name }}"
              required
            />
          </td>
          <td>
            <input
              type="number"
              name="items[{{ $index }}].quantity"
              value="{{ $item.Quantity }}"
              step="0.001"
              required
            />
          </td>
          <td>
            <input
              type="number"
              name="items[{{ $index }}].unit_price"
              value="{{ $item.UnitPrice }}"
              step="0.01"
              required
            />
          </td>
          <td>
            <input
              type="number"
              name="items[{{ $index }}].discount_per_unit"
              value="{{ $item.DiscountPerUnit }}"
              step="0.01"
            />
          </td>
          <td>
            <input
              type="number"
              name="items[{{ $index }}].total_price"
              value="{{ $item.TotalPrice }}"
              step="0.01"
              required
            />
          </td>
          <td>
            <input
              type="number"
              name="items[{{ $index }}].total_discount"
              value="{{ $item.TotalDiscount }}"
              step="0.01"
            />
          </td>
          <td>
            <input
              type="hidden"
              name="items[{{ $index }}].supermarket_name"
              value="{{ $.Store }}"
            />{{ $.Store }}
          </td>
        </tr>
        {{ end }}
      </tbody>
    </table>
    <div class="btn-container" style="margin-top: 1.5em;">
      <button type="submit" class="btn-primary">Confirm & Save All</button>
      <button type="button" class="btn-secondary" hx-get="/groceries/form" hx-target="#result" hx-swap="innerHTML">
        Clear
      </button>
    </div>
  </form>
</div>
{{ end }}
