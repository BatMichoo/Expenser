{{/* One place for the app's line icons (Lucide style, 24x24 grid).
     Expects Name; optional Size (px, default 18) and Stroke (default 2).
     Icons are decorative: the text next to them says what they mean. */}}
{{ define "icon" -}}
<svg xmlns="http://www.w3.org/2000/svg" width="{{ or .Size 18 }}" height="{{ or .Size 18 }}" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="{{ or .Stroke 2 }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {{ if eq .Name "house" }}<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" />
  {{ else if eq .Name "car" }}<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" /><circle cx="7" cy="17" r="2" /><path d="M9 17h6" /><circle cx="17" cy="17" r="2" />
  {{ else if eq .Name "groceries" }}<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" /><path d="M3 6h18" /><path d="M16 10a4 4 0 0 1-8 0" />
  {{ else if eq .Name "bills" }}<rect width="18" height="18" x="3" y="4" rx="2" /><path d="M16 2v4" /><path d="M8 2v4" /><path d="M3 10h18" /><path d="m9 16 2 2 4-4" />
  {{ else if eq .Name "login" }}<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /><polyline points="10 17 15 12 10 7" /><line x1="15" y1="12" x2="3" y2="12" />
  {{ else if eq .Name "register" }}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><line x1="22" y1="11" x2="16" y2="11" /><line x1="19" y1="8" x2="19" y2="14" />
  {{ else if eq .Name "check" }}<path d="M20 6 9 17l-5-5" />
  {{ else if eq .Name "alert" }}<path d="M12 8v4" /><path d="M12 16h.01" />
  {{ else if eq .Name "moon" }}<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
  {{ else if eq .Name "receipt" }}<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" /><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" /><path d="M12 17.5v-11" />
  {{ else if eq .Name "chart" }}<path d="M3 3v18h18" /><path d="M7 16v-3" /><path d="M12 16V8" /><path d="M17 16v-6" />
  {{ else if eq .Name "pie" }}<path d="M21.21 15.89A10 10 0 1 1 8 2.83" /><path d="M22 12A10 10 0 0 0 12 2v10z" />
  {{ else if eq .Name "calendar" }}<rect width="18" height="18" x="3" y="4" rx="2" /><path d="M16 2v4" /><path d="M8 2v4" /><path d="M3 10h18" />
  {{ else if eq .Name "target" }}<circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" />
  {{ else if eq .Name "trend" }}<path d="M3 3v18h18" /><path d="m19 9-5 5-4-4-3 3" />
  {{ else if eq .Name "bell" }}<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
  {{ else if eq .Name "calendar-days" }}<rect width="18" height="18" x="3" y="4" rx="2" /><path d="M16 2v4" /><path d="M8 2v4" /><path d="M3 10h18" /><path d="M8 14h.01" /><path d="M12 14h.01" /><path d="M16 14h.01" />
  {{ else if eq .Name "history" }}<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" />
  {{ else if eq .Name "phone" }}<rect width="14" height="20" x="5" y="2" rx="2" /><path d="M12 18h.01" />
  {{ end }}
</svg>
{{- end }}
