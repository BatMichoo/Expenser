{{ define "create-groceries-form" }}
<form class="new-expense-form">
    <h3>{{ T .Lang "form.create" }}</h3>
    <div>
        <label for="category_id">{{ T .Lang "groceries.category" }}</label>
        <select id="category_id" name="category_id" required>
            {{ range .Categories }}
            <option value="{{ .ID }}">{{ .Name }}</option>
            {{ end }}
        </select>
    </div>
    <div>
        <label for="product">{{ T .Lang "groceries.product" }}</label>
        <input type="text" id="product" name="product" required />
    </div>
    <div>
        <label for="quantity">{{ T .Lang "groceries.quantity" }}</label>
        <input type="number" id="quantity" name="quantity" step="0.1" required />
    </div>
    <div>
        <label for="unit_price">{{ T .Lang "groceries.unit_price" }}</label>
        <input type="number" id="unit_price" name="unit_price" step="0.01" required />
    </div>
    <div>
        <label for="total_price">{{ T .Lang "groceries.total_price" }}</label>
        <input type="number" id="total_price" name="total_price" step="0.01" required />
    </div>
    <div>
        <label for="supermarket_name">{{ T .Lang "groceries.supermarket" }}</label>
        <input type="text" id="supermarket_name" name="supermarket_name" />
    </div>
    <div>
        <button type="submit" class="btn-primary" 
            hx-post="/groceries" 
            hx-target="#recent-expenses" 
            hx-swap="afterbegin" 
            hx-on::after-request="if(event.detail.successful && event.target === this) hideDialog()">
            {{ T .Lang "common.save" }}
        </button>
        <button type="button" class="btn-secondary" onclick="hideDialog()">{{ T .Lang "common.cancel" }}</button>
    </div>
</form>
{{ end }}
