{{ define "create-groceries-form" }}
<div class="sheet">
  {{ template "sheet-heading" (dict "Title" (T .Lang "form.add_new") "Lang" .Lang) }}
  <form class="new-expense-form" hx-post="/groceries" hx-target="#recent-expenses" hx-swap="afterbegin"
    hx-on::after-request="if(event.detail.successful && event.target === this) { hideDialog(); }">
    <div>
      <label for="product">{{ T .Lang "groceries.product" }}</label>
      <input type="text" id="product" name="product" required
        hx-get="/groceries/size-guess" hx-trigger="keyup changed delay:400ms" hx-target="#size-fields" hx-swap="outerHTML"
        hx-include="#quantity, #size-fields" hx-vals='{"id": "size-fields"}' />
    </div>
    <div class="amount-field">
      <label for="total_price">{{ T .Lang "groceries.total_price" }}</label>
      <input type="number" id="total_price" name="total_price" step="0.01" inputmode="decimal" placeholder="0.00" required />
    </div>
    <div class="qty-unit">
      <div>
        <label for="quantity">{{ T .Lang "groceries.quantity" }}</label>
        <input type="number" id="quantity" name="quantity" step="0.1" inputmode="decimal" required />
      </div>
      <div>
        <label for="unit_price">{{ T .Lang "groceries.unit_price" }}</label>
        <input type="number" id="unit_price" name="unit_price" step="0.01" inputmode="decimal" required />
      </div>
    </div>
    {{ template "size-fields" (dict "Prefix" "" "ID" "size-fields" "Unit" "" "Size" 0.0 "Lang" .Lang) }}
    <div>
      <label for="category_id">{{ T .Lang "groceries.category" }}</label>
      <select id="category_id" name="category_id" required>
        {{ range .Categories }}
        <option value="{{ .ID }}" >{{ T $.Lang (print "category." .Name) }}</option>
        {{ end }}
      </select>
    </div>
    <div>
      <label for="supermarket_name">{{ T .Lang "groceries.supermarket" }}</label>
      <input type="text" id="supermarket_name" name="supermarket_name" />
    </div>
    <details class="more-fields">
      <summary>{{ T .Lang "common.discount" }}</summary>
      <div class="more-fields-body">
        <div>
          <label for="discount_per_unit">{{ T .Lang "groceries.discount_per_unit" }}</label>
          <input type="number" id="discount_per_unit" name="discount_per_unit" step="0.01" inputmode="decimal" />
        </div>
        <div>
          <label for="total_discount">{{ T .Lang "groceries.total_discount" }}</label>
          <input type="number" id="total_discount" name="total_discount" step="0.01" inputmode="decimal" />
        </div>
      </div>
    </details>
    <div class="sheet-actions">
      <button type="button" class="sheet-cancel" onclick="hideDialog()">{{ T .Lang "common.cancel" }}</button>
      <button type="submit" class="btn-primary sheet-save">{{ T .Lang "common.save" }}</button>
    </div>
  </form>
</div>
{{ end }}
