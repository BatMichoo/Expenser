{{ define "edit-groceries-form" }}
<form class="new-expense-form" hx-put="/groceries/{{ .Expense.ID }}" hx-target="#grocery-{{ .Expense.ID }}" hx-swap="outerHTML">
    <h3>{{ T .Lang "form.edit" }}</h3>
    <div>
        <label for="product">{{ T .Lang "groceries.product" }}</label>
        <input type="text" id="product" name="product" value="{{ .Expense.Product }}" required />
    </div>
    <div>
        <label for="quantity">{{ T .Lang "groceries.quantity" }}</label>
        <input type="number" id="quantity" name="quantity" step="0.1" value="{{ .Expense.Quantity }}" required />
    </div>
    <div>
        <label for="price">{{ T .Lang "groceries.price" }}</label>
        <input type="number" id="price" name="price" step="0.01" value="{{ div (float64 .Expense.Price) 100.0 }}" required />
    </div>
    <div>
        <label for="supermarket_name">{{ T .Lang "groceries.supermarket" }}</label>
        <input type="text" id="supermarket_name" name="supermarket_name" value="{{ .Expense.SupermarketName }}" />
    </div>
    <div>
        <button type="submit" class="btn-primary">{{ T .Lang "common.save" }}</button>
        <button type="button" onclick="hideDialog()">{{ T .Lang "common.cancel" }}</button>
    </div>
</form>
{{ end }}
