{{ define "exp-chart" }}
<section id="chart-section">
  <div>
    <form id="search-form">
      <div>
        <label for="type">{{ T .Lang "form.expense_type" }}</label>
        <select id="type">
          <option value="">{{ T .Lang "common.all" }}</option>
          {{ range .Types }}
          <option value="{{ .ID }}">{{ .Name }}</option>
          {{ end }}
        </select>
      </div>
      <div>
        <label for="year">{{ T .Lang "common.year" }}</label>
        <input type="number" id="year" value="{{ .Year }}" />
      </div>
      <button type="button" class="chart-search" id="{{.Type}}-chart-search">
        {{ T .Lang "search.title" }}
      </button>
    </form>
  </div>
  <canvas id="chart"></canvas>
  <script type="module" src="../../../static/js/{{.Type}}-chart.js"></script>
</section>
{{ end }}
