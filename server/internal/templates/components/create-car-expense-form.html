{{ define "create-car-exp-form" }}
<div>
  <h2 class="new-expense-heading">
    {{ T .Lang "form.add_new" }}
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="1" x2="12" y2="23" />
      <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
    </svg>
  </h2>
  <form class="new-expense-form" hx-post="/car/expenses" hx-target="#recent-expenses" hx-swap="afterbegin"
    hx-on::after-request="if(event.detail.successful && event.target === this) {
        hideDialog();
    }">
    <div>
      <label for="utilityType">{{ T .Lang "form.expense_type" }}</label>
      <select id="utilityType" name="typeID" required hx-get="/car/expenses/metadata" hx-target="#metadata-fields"
        hx-swap="innerHTML">
        <option value="">{{ T .Lang "form.select_type" }}</option>
        {{range .Types}}
        <option value="{{ .ID }}">{{ T $.Lang (print "type." .Name) }}</option>
        {{end}}
      </select>
    </div>
    <div id="metadata-fields"></div>
    <div>
      <label for="amount">{{ T .Lang "common.amount" }} (lv)</label>
      <input type="number" id="amount" name="amount" step="0.01" min="0" required placeholder='{{ T .Lang "form.amount_placeholder" }}' />
    </div>
    <div>
      <label for="expenseDate">{{ T .Lang "common.date" }}</label>
      <input type="date" id="expenseDate" name="date" required />
    </div>
    <div>
      <label for="notes">{{ T .Lang "common.notes" }}</label>
      <textarea id="notes" name="notes" rows="3" placeholder='{{ T .Lang "form.notes_placeholder" }}'></textarea>
    </div>
    <div>
      <button type="submit" class="btn-primary">{{ T .Lang "common.add" }}</button>
      <button type="button" class="btn-primary" onClick="hideDialog();">
        {{ T .Lang "common.cancel" }}
      </button>
    </div>
  </form>
</div>
{{ end }}
